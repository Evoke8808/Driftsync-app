<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DriftSync - Come back</title>
<style>
    /* Full-screen see-through red layer shown while the desk check alarm rings */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: default;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; user-select: none; }
    .tint { position: fixed; inset: 0; background: rgba(210, 20, 20, .38);
            display: flex; align-items: center; justify-content: center;
            animation: flash 1s ease-in-out infinite; }
    @keyframes flash { 0%, 100% { background: rgba(210, 20, 20, .30); } 50% { background: rgba(210, 20, 20, .50); } }
    .box { text-align: center; color: #fff; padding: 40px 56px; border-radius: 32px;
           background: rgba(40, 0, 0, .55); border: 2px solid rgba(255, 120, 120, .8);
           box-shadow: 0 20px 80px rgba(0, 0, 0, .4); }
    .label { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #FFB4B4; }
    .title { font-size: 46px; font-weight: 700; margin: 10px 0 6px; }
    .time { font-size: 96px; font-weight: 700; font-variant-numeric: tabular-nums; color: #FF5A5A; line-height: 1.1; }
    .note { font-size: 18px; color: #FFD6D6; margin-top: 10px; }
    .end { margin-top: 26px; padding: 10px 18px; border-radius: 999px; cursor: pointer; font-size: 13px;
           background: transparent; color: #FFD6D6; border: 1px solid rgba(255, 180, 180, .6); }
    .end:hover { background: rgba(255, 255, 255, .1); }
</style>
</head>
<body>
<div class="tint">
    <div class="box">
        <div class="label">Desk check</div>
        <div class="title">Come back to your desk</div>
        <div id="time" class="time">00:00</div>
        <div class="note">Your focus timer is paused. The alarm stops when the camera sees you.</div>
        <button class="end" onclick="endBlock()">Camera can't see me? End this focus block</button>
    </div>
</div>
<script>
    let awaySinceMs = 0;
    async function poll() {
        try {
            const s = await window.pywebview.api.get_desk_status();
            if (s && s.awayFor && (!awaySinceMs || s.state !== "away")) awaySinceMs = Date.now() - s.awayFor * 1000;
            if (s && s.state === "present") awaySinceMs = 0;
        } catch (e) {}
    }
    async function endBlock() {
        try { await window.pywebview.api.desk_end_block(); } catch (e) {}
    }
    function tick() {
        const sec = awaySinceMs ? Math.max(0, Math.floor((Date.now() - awaySinceMs) / 1000)) : 0;
        document.getElementById('time').innerText =
            `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    }
    setInterval(poll, 1000);
    setInterval(tick, 250);
    window.addEventListener('pywebviewready', poll);
</script>
</body>
</html>
